# =============================================================================
# NostalgiaBox configuration
# =============================================================================
# Copy this file to `config.yaml` (or /etc/nostalgiabox/config.yaml). The same
# keys work in config.tilt.yaml for local Tilt (change paths only).
#
#     nostalgiabox --check

# -----------------------------------------------------------------------------
# Mixed pool (recommended): one folder, 10 always-on channels.
# Each file is on only one mixed channel for the calendar day; next day
# reshuffles. Empty slots show empty_channel_message.
# -----------------------------------------------------------------------------
mixed:
  path: /media/nostalgiabox/pool
  count: 10
  first_number: 1
  name_prefix: Kanal

empty_channel_message: "Ovaj kanal nema danas crtaća"

# Dedicated show (optional). Use numbers outside 1–10. Those files are removed
# from the mixed pool so they are not duplicated.
# channels:
#   - number: 11
#     name: "Arthur"
#     path: /media/nostalgiabox/arthur

# Legacy: one channel per sub-folder
# media_root: /media/nostalgiabox
# first_channel_number: 2

# -----------------------------------------------------------------------------
# How a channel behaves when you tune into it.
#   random    - start a fresh random episode
#   resume    - pick up where you left off on that channel last time
#   broadcast - always-on station clock (leave and return mid-episode)
# -----------------------------------------------------------------------------
tune_in: broadcast

start_channel: 1

# --- The "feel" of the TV ----------------------------------------------------
force_4_3: false

# 0 = join at the broadcast clock (no fake "6 seconds in" skip).
start_offset: 0

transition: none
transition_duration: 0.4
bridge_seconds: 0.8
channel_bug_seconds: 4
osd_duration: 2

ui:
  font: "VT323"
  color: "#4DFF5A"
  dim_color: "#123B18"
  glow: true

crt:
  enabled: true
  curvature: 0.12
  corner_radius: 0.065
  vignette: 0.25
  scanlines: true
  scanline_intensity: 0.12

initial_volume: 70
volume_step: 5
# fullscreen: true

# audio_device: "alsa/hdmi:CARD=vc4hdmi0,DEV=0"

power_off_on_min_volume: false

# Stop playing files after HDMI has been down this many seconds (TV off).
# 0 = never. The broadcast clock still advances; wake retunes to "what's on now".
hdmi_idle_pause_seconds: 600

scan_recursive: true
# shuffle_seed: 1234

input:
  keyboard: true
  cec: true
  stdin: false
  # Laptop / Tilt only. Leave off on the Pi.
  # dev_http: false
  # dev_http_port: 8765
