# Local Tilt — same mixed-channel behaviour as the Pi, different paths.

mixed:
  path: dev/media/Sample Channel
  count: 10
  first_number: 1
  name_prefix: Kanal

empty_channel_message: "Ovaj kanal nema danas crtaća"

tune_in: broadcast
start_offset: 0
start_channel: 1
transition: none
bridge_seconds: 0.8

fullscreen: false
power_off_on_min_volume: false

input:
  keyboard: false
  cec: false
  stdin: false
  dev_http: true
  dev_http_port: 8765

crt:
  enabled: true
